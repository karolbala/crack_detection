[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crackseg"
version = "0.1.0"
description = "Segmentacja uszkodzeń nawierzchni z ortofoto"
requires-python = ">=3.10"
dependencies = [
    "lightning",
    "segmentation-models-pytorch",
    "albumentations",
    "mlflow",
    "opencv-python",
    "pandas",
    "numpy",
    "rasterio",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
api = ["fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]
